services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: tokentrim-ml-service
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - ENABLE_PROMPT_LOGGING=false
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN:-local-development-token}
      - MODEL_DIR=/app/models
      - DATA_DIR=/app/data
    volumes:
      - ./ml-service/models:/app/models
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tokentrim-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_TIMEOUT_MS=6000
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN:-local-development-token}
      - ENABLE_PROMPT_LOGGING=false
    depends_on:
      ml-service:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
